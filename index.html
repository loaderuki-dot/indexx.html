<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Quiz Machine Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">⚡ IT Machine Quiz</div>
        <div class="stats">
            <div class="stat-badge">XP: <span id="xp-count">0</span></div>
            <div class="stat-badge">Level: <span id="level-count">1</span></div>
        </div>
    </header>

    <div class="container" id="quiz-app">
        <h2 id="question-title">Tayyormisiz? IT bilimingizni sinab ko'ring!</h2>
        <p id="question-desc" class="sub-text">Quyidagi kategoriyalardan birini tanlang va testni boshlang.</p>
        
        <div class="options-grid" id="main-menu">
            <button class="btn" onclick="startCategory('js')">JavaScript Testlar</button>
            <button class="btn" onclick="startCategory('python')">Python Testlar</button>
            <button class="btn" onclick="startCategory('cyber')">Kiberxavfsizlik Testlar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
